; BlueShift — PlatformIO (Milestone 3)
;
; skeleton     — provisional esp32dev compile-smoke
; t-lion-debug / t-lion-release — DOCUMENTED T-Lion (IMPLEMENTED_UNVERIFIED)
; native       — host unit tests (no ESP32 hardware)
;
; Platform pin: espressif32 @ 6.9.0
; OLED: thingpulse ESP8266/ESP32 SSD1306 driver @ 4.6.2 (MIT)
; BLE spike: optional NimBLE via BLUESHIFT_ENABLE_NIMBLE (off by default —
;            dual Classic+NimBLE needs EspBle/Arduino 3.x; see docs/bluetooth/)

[platformio]
default_envs = skeleton
description = BlueShift Milestone 3 — pre-hardware implementation
boards_dir = boards

[common]
build_unflags =
    -std=gnu++11
build_flags =
    -Iinclude
    -Icomponents
    -Icomponents/i18n
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter
build_src_filter =
    +<*>
    +<../components/app/*.cpp>
    +<../components/bridge/*.cpp>
    +<../components/hid/*.cpp>
    +<../components/input/*.cpp>
    +<../components/battery/*.cpp>
    +<../components/power/*.cpp>
    +<../components/ui/*.cpp>
    +<../components/i18n/*.cpp>
    +<../components/storage/*.cpp>
    +<../components/bluetooth/*.cpp>
    +<../components/display/*.cpp>

[env]
platform = espressif32 @ 6.9.0
monitor_speed = 115200
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
build_src_filter = ${common.build_src_filter}
check_tool = cppcheck
check_flags = --enable=warning
check_src_filters =
    +<src/>
    +<include/>
    +<components/>

[env:skeleton]
framework = arduino
board = esp32dev
build_type = debug
build_flags =
    ${common.build_flags}
    -DBLUESHIFT_BUILD_TYPE_DEBUG=1
; No ThingPulse on skeleton — uses FramebufferDisplay path in Application.

[env:t-lion-debug]
framework = arduino
board = lilygo_t_lion
build_type = debug
lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ 4.6.2
build_flags =
    ${common.build_flags}
    -DBLUESHIFT_BUILD_TYPE_DEBUG=1
    -DBLUESHIFT_BOARD_T_LION=1
    -DBOARD_HAS_PSRAM
; NimBLE optional: uncomment lib_deps line + flag when measuring dual-stack fit.
;    -DBLUESHIFT_ENABLE_NIMBLE=1
; lib_deps also: h2zero/NimBLE-Arduino @ 1.4.2

[env:t-lion-release]
framework = arduino
board = lilygo_t_lion
build_type = release
lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ 4.6.2
build_flags =
    ${common.build_flags}
    -DBLUESHIFT_BUILD_TYPE_DEBUG=0
    -DBLUESHIFT_BOARD_T_LION=1
    -DBOARD_HAS_PSRAM
    -DNDEBUG

[env:native]
platform = native
build_flags =
    -Iinclude
    -Icomponents
    -Icomponents/i18n
    -std=c++17
    -Wall
    -Wextra
    -DBLUESHIFT_HOST_TEST=1
build_src_filter =
    -<main.cpp>
    +<../test/host/run_host_tests.cpp>
    +<../components/bridge/*.cpp>
    +<../components/hid/*.cpp>
    +<../components/input/*.cpp>
    +<../components/battery/*.cpp>
    +<../components/power/*.cpp>
    +<../components/ui/*.cpp>
    +<../components/i18n/*.cpp>
    +<../components/storage/*.cpp>
    +<../components/bluetooth/*.cpp>

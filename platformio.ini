; BlueShift — PlatformIO (Milestone 2)
;
; skeleton     — provisional esp32dev compile-smoke (kept)
; t-lion-debug / t-lion-release — DOCUMENTED pin assumptions via boards/lilygo_t_lion.json
;                 Status: IMPLEMENTED_UNVERIFIED until physical board arrives
; native       — host unit tests (no ESP32 hardware)
;
; Platform pin: espressif32 @ 6.9.0
; No Bluepad32 / EspBle / BTstack lib_deps yet (stack spike separate).

[platformio]
default_envs = skeleton
description = BlueShift Milestone 2 — pre-hardware architecture
boards_dir = boards

[common]
build_flags =
    -Iinclude
    -Icomponents
    -Icomponents/i18n
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter
build_src_filter =
    +<*>
    +<../components/bridge/*.cpp>
    +<../components/hid/*.cpp>
    +<../components/input/*.cpp>
    +<../components/battery/*.cpp>
    +<../components/power/*.cpp>
    +<../components/ui/*.cpp>
    +<../components/i18n/*.cpp>

[env]
platform = espressif32 @ 6.9.0
monitor_speed = 115200
build_flags = ${common.build_flags}
build_src_filter = ${common.build_src_filter}
check_tool = cppcheck
check_flags = --enable=warning
check_src_filters =
    +<src/>
    +<include/>
    +<components/>

[env:skeleton]
framework = arduino
board = esp32dev
build_type = debug
build_flags =
    ${common.build_flags}
    -DBLUESHIFT_BUILD_TYPE_DEBUG=1

[env:t-lion-debug]
framework = arduino
; IMPLEMENTED_UNVERIFIED — custom board JSON based on DOCUMENTED WROVER + PSRAM assumptions.
board = lilygo_t_lion
build_type = debug
build_flags =
    ${common.build_flags}
    -DBLUESHIFT_BUILD_TYPE_DEBUG=1
    -DBLUESHIFT_BOARD_T_LION=1
    -DBOARD_HAS_PSRAM

[env:t-lion-release]
framework = arduino
board = lilygo_t_lion
build_type = release
build_flags =
    ${common.build_flags}
    -DBLUESHIFT_BUILD_TYPE_DEBUG=0
    -DBLUESHIFT_BOARD_T_LION=1
    -DBOARD_HAS_PSRAM
    -DNDEBUG

[env:native]
; Requires a host C++ compiler (g++/clang++) on PATH.
; On this Windows machine without g++, use: npm run test:host
platform = native
build_flags =
    -Iinclude
    -Icomponents
    -Icomponents/i18n
    -std=c++17
    -Wall
    -Wextra
    -DBLUESHIFT_HOST_TEST=1
build_src_filter =
    -<main.cpp>
    +<../test/host/run_host_tests.cpp>
    +<../components/bridge/*.cpp>
    +<../components/hid/*.cpp>
    +<../components/input/*.cpp>
    +<../components/battery/*.cpp>
    +<../components/power/*.cpp>
    +<../components/ui/*.cpp>
    +<../components/i18n/*.cpp>

; BlueShift — PlatformIO (Milestone 3 + IDF spike)
;
; skeleton     — provisional esp32dev compile-smoke (Arduino)
; t-lion-debug / t-lion-release — DOCUMENTED T-Lion (Arduino, IMPLEMENTED_UNVERIFIED)
; t-lion-idf-spike* — native ESP-IDF compile/link feasibility (experimental)
; native       — host unit tests (no ESP32 hardware)
;
; Platform pin: espressif32 @ 6.9.0
; ESP-IDF pin (native spike): framework-espidf @ 3.50301.0 (= ESP-IDF 5.3.1)
; OLED: thingpulse ESP8266/ESP32 SSD1306 driver @ 4.6.2 (MIT)
; BLE HOGP: optional -DBLUESHIFT_ENABLE_ESP_IDF_BLE_HID (report builders always on)
; Classic HID Host: requires SDK with CONFIG_BT_HID_HOST_ENABLED (not in Arduino 2.x prebuild)
; Production architecture: ESP-IDF Bluedroid BTDM — see docs/bluetooth/esp-idf-dual-mode-spike.md
; BTstack is NOT a dependency.

[platformio]
default_envs = skeleton
description = BlueShift Milestone 3 — pre-hardware implementation
boards_dir = boards

[common]
build_unflags =
    -std=gnu++11
build_flags =
    -Iinclude
    -Icomponents
    -Icomponents/i18n
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter
build_src_filter =
    +<*>
    -<idf_spike/>
    +<../components/app/*.cpp>
    +<../components/bridge/*.cpp>
    +<../components/hid/*.cpp>
    +<../components/input/*.cpp>
    +<../components/battery/*.cpp>
    +<../components/power/*.cpp>
    +<../components/ui/*.cpp>
    +<../components/i18n/*.cpp>
    +<../components/storage/*.cpp>
    +<../components/bluetooth/*.cpp>
    +<../components/display/*.cpp>

[env]
platform = espressif32 @ 6.9.0
monitor_speed = 115200
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
build_src_filter = ${common.build_src_filter}
check_tool = cppcheck
check_flags = --enable=warning
check_src_filters =
    +<src/>
    +<include/>
    +<components/>

[env:skeleton]
framework = arduino
board = esp32dev
build_type = debug
build_flags =
    ${common.build_flags}
    -DBLUESHIFT_BUILD_TYPE_DEBUG=1
; No ThingPulse on skeleton — uses FramebufferDisplay path in Application.

[env:t-lion-debug]
framework = arduino
board = lilygo_t_lion
build_type = debug
lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ 4.6.2
build_flags =
    ${common.build_flags}
    -DBLUESHIFT_BUILD_TYPE_DEBUG=1
    -DBLUESHIFT_BOARD_T_LION=1
    -DBOARD_HAS_PSRAM
; NimBLE optional: uncomment lib_deps line + flag when measuring dual-stack fit.
;    -DBLUESHIFT_ENABLE_NIMBLE=1
; lib_deps also: h2zero/NimBLE-Arduino @ 1.4.2

[env:t-lion-release]
framework = arduino
board = lilygo_t_lion
build_type = release
lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ 4.6.2
build_flags =
    ${common.build_flags}
    -DBLUESHIFT_BUILD_TYPE_DEBUG=0
    -DBLUESHIFT_BOARD_T_LION=1
    -DBOARD_HAS_PSRAM
    -DNDEBUG

[env:native]
platform = native
build_flags =
    -Iinclude
    -Icomponents
    -Icomponents/i18n
    -std=c++17
    -Wall
    -Wextra
    -DBLUESHIFT_HOST_TEST=1
build_src_filter =
    -<main.cpp>
    -<idf_spike/>
    +<../test/host/run_host_tests.cpp>
    +<../components/bridge/*.cpp>
    +<../components/hid/*.cpp>
    +<../components/input/*.cpp>
    +<../components/battery/*.cpp>
    +<../components/power/*.cpp>
    +<../components/ui/*.cpp>
    +<../components/i18n/*.cpp>
    +<../components/storage/*.cpp>
    +<../components/bluetooth/*.cpp>

; ---------------------------------------------------------------------------
; Native ESP-IDF feasibility spikes (original ESP32 / T-Lion).
; Do NOT migrate product firmware here — compile/link proofs only.
; Arduino envs above remain the known compile baseline.
; sdkconfig.defaults is selected by spike/idf/pio_sdkconfig_pre.py
; ---------------------------------------------------------------------------

[env:t-lion-idf-spike]
; Critical proof: Classic HID Host + BLE HID Device in ONE binary.
framework = espidf
board = lilygo_t_lion
build_type = debug
build_unflags =
build_flags =
    -Wall
    -Wextra
; Clear Arduino [env] src filter inheritance — spike sources come from src/CMakeLists.txt only.
build_src_filter =
    -<**/*>
board_build.cmake_extra_args =
    -DBLUESHIFT_SPIKE_MODE=dual
platform_packages =
    framework-espidf @ 3.50301.0
extra_scripts =
    pre:spike/idf/pio_sdkconfig_pre.py
monitor_speed = 115200

[env:t-lion-idf-spike-classic]
framework = espidf
board = lilygo_t_lion
build_type = debug
build_unflags =
build_flags =
    -Wall
    -Wextra
build_src_filter =
    -<**/*>
board_build.cmake_extra_args =
    -DBLUESHIFT_SPIKE_MODE=classic
platform_packages =
    framework-espidf @ 3.50301.0
extra_scripts =
    pre:spike/idf/pio_sdkconfig_pre.py
monitor_speed = 115200

[env:t-lion-idf-spike-ble]
framework = espidf
board = lilygo_t_lion
build_type = debug
build_unflags =
build_flags =
    -Wall
    -Wextra
build_src_filter =
    -<**/*>
board_build.cmake_extra_args =
    -DBLUESHIFT_SPIKE_MODE=ble
platform_packages =
    framework-espidf @ 3.50301.0
extra_scripts =
    pre:spike/idf/pio_sdkconfig_pre.py
monitor_speed = 115200

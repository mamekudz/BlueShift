; BlueShift — PlatformIO
;
; Arduino LEGACY / BASELINE / COMPARISON:
;   skeleton, t-lion-debug, t-lion-release
;
; Native ESP-IDF PRODUCTION path (intended future):
;   t-lion-idf-debug, t-lion-idf-release
;
; Feasibility proofs (keep):
;   t-lion-idf-spike*
;
; Host tests:
;   native
;
; Platform pin: espressif32 @ 6.9.0
; ESP-IDF pin: framework-espidf @ 3.50301.0 (= ESP-IDF 5.3.1)
; Production: Bluedroid BTDM — no NimBLE, no BTstack
; OLED Arduino path: ThingPulse @ 4.6.2 (MIT) — LEGACY only
; OLED IDF path: project-owned IdfSsd1306Display

[platformio]
default_envs = skeleton
description = BlueShift — Classic→BLE HID bridge
boards_dir = boards

[common]
build_unflags =
    -std=gnu++11
build_flags =
    -Iinclude
    -Icomponents
    -Icomponents/i18n
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter
build_src_filter =
    +<*>
    -<idf_spike/>
    -<idf_app/>
    +<../components/app/*.cpp>
    +<../components/bridge/*.cpp>
    +<../components/hid/*.cpp>
    +<../components/input/*.cpp>
    +<../components/battery/*.cpp>
    +<../components/power/*.cpp>
    +<../components/ui/*.cpp>
    +<../components/i18n/*.cpp>
    +<../components/storage/*.cpp>
    +<../components/bluetooth/*.cpp>
    +<../components/display/*.cpp>
    +<../components/diagnostics/*.cpp>

[env]
platform = espressif32 @ 6.9.0
monitor_speed = 115200
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
build_src_filter = ${common.build_src_filter}
check_tool = cppcheck
check_flags = --enable=warning
check_src_filters =
    +<src/>
    +<include/>
    +<components/>

; ----- Arduino LEGACY baseline -----

[env:skeleton]
framework = arduino
board = esp32dev
build_type = debug
build_flags =
    ${common.build_flags}
    -DBLUESHIFT_BUILD_TYPE_DEBUG=1

[env:t-lion-debug]
; LEGACY / COMPARISON — do not add major production features here
framework = arduino
board = lilygo_t_lion
build_type = debug
lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ 4.6.2
build_flags =
    ${common.build_flags}
    -DBLUESHIFT_BUILD_TYPE_DEBUG=1
    -DBLUESHIFT_BOARD_T_LION=1
    -DBOARD_HAS_PSRAM

[env:t-lion-release]
; LEGACY / COMPARISON
framework = arduino
board = lilygo_t_lion
build_type = release
lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ 4.6.2
build_flags =
    ${common.build_flags}
    -DBLUESHIFT_BUILD_TYPE_DEBUG=0
    -DBLUESHIFT_BOARD_T_LION=1
    -DBOARD_HAS_PSRAM
    -DNDEBUG

[env:native]
platform = native
build_flags =
    -Iinclude
    -Icomponents
    -Icomponents/i18n
    -std=c++17
    -Wall
    -Wextra
    -DBLUESHIFT_HOST_TEST=1
build_src_filter =
    -<main.cpp>
    -<idf_spike/>
    -<idf_app/>
    +<../test/host/run_host_tests.cpp>
    +<../components/bridge/*.cpp>
    +<../components/hid/*.cpp>
    +<../components/input/*.cpp>
    +<../components/battery/*.cpp>
    +<../components/power/*.cpp>
    +<../components/ui/*.cpp>
    +<../components/i18n/*.cpp>
    +<../components/storage/*.cpp>
    +<../components/bluetooth/*.cpp>
    +<../components/diagnostics/*.cpp>
    -<../components/display/idf_ssd1306_display.cpp>
    -<../components/display/ssd1306_display.cpp>
    -<../components/app/*.cpp>

; ----- Native ESP-IDF PRODUCTION (intended) -----

[env:t-lion-idf-debug]
framework = espidf
board = lilygo_t_lion
build_type = debug
build_unflags =
build_flags =
    -Wall
    -Wextra
    -DBLUESHIFT_BUILD_TYPE_DEBUG=1
build_src_filter =
    -<**/*>
board_build.partitions = partitions/t-lion-debug.csv
platform_packages =
    framework-espidf @ 3.50301.0
extra_scripts =
    pre:spike/idf/pio_sdkconfig_pre.py
monitor_speed = 115200

[env:t-lion-idf-release]
framework = espidf
board = lilygo_t_lion
build_type = release
build_unflags =
build_flags =
    -Wall
    -Wextra
    -DBLUESHIFT_BUILD_TYPE_DEBUG=0
    -DNDEBUG
build_src_filter =
    -<**/*>
board_build.partitions = partitions/t-lion-no-ota.csv
platform_packages =
    framework-espidf @ 3.50301.0
extra_scripts =
    pre:spike/idf/pio_sdkconfig_pre.py
monitor_speed = 115200

; ----- Feasibility spikes (do not use as production) -----

[env:t-lion-idf-spike]
framework = espidf
board = lilygo_t_lion
build_type = debug
build_unflags =
build_flags =
    -Wall
    -Wextra
build_src_filter =
    -<**/*>
board_build.cmake_extra_args =
    -DBLUESHIFT_SPIKE_MODE=dual
platform_packages =
    framework-espidf @ 3.50301.0
extra_scripts =
    pre:spike/idf/pio_sdkconfig_pre.py
monitor_speed = 115200

[env:t-lion-idf-spike-classic]
framework = espidf
board = lilygo_t_lion
build_type = debug
build_unflags =
build_flags =
    -Wall
    -Wextra
build_src_filter =
    -<**/*>
board_build.cmake_extra_args =
    -DBLUESHIFT_SPIKE_MODE=classic
platform_packages =
    framework-espidf @ 3.50301.0
extra_scripts =
    pre:spike/idf/pio_sdkconfig_pre.py
monitor_speed = 115200

[env:t-lion-idf-spike-ble]
framework = espidf
board = lilygo_t_lion
build_type = debug
build_unflags =
build_flags =
    -Wall
    -Wextra
build_src_filter =
    -<**/*>
board_build.cmake_extra_args =
    -DBLUESHIFT_SPIKE_MODE=ble
platform_packages =
    framework-espidf @ 3.50301.0
extra_scripts =
    pre:spike/idf/pio_sdkconfig_pre.py
monitor_speed = 115200

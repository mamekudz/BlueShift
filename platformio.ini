; BlueShift — PlatformIO foundation (milestone 1)
;
; Intended hardware: LILYGO T-Lion (classic ESP32-WROVER, OLED, 18650)
; Status: board revision and pinout are UNVERIFIED until physical hardware arrives.
;
; PlatformIO has no dedicated "lilygo-t-lion" board ID (researched 2026-09).
; Closest generic targets: esp32dev, esp-wrover-kit, freenove_esp32_wrover, upesy_wrover.
;
; Decision for milestone 1:
;   - Use board = esp32dev as a PROVISIONAL compile-smoke target only.
;   - Do NOT treat this as a verified T-Lion configuration.
;   - Do NOT hard-code GPIO / OLED / battery / button pins here.
;   - Retarget debug/release when the physical board is brought up.
;
; Platform pin: espressif32 6.9.0 (Arduino-ESP32 2.x line; classic ESP32).
; Not "latest" — revise deliberately after T-Lion bring-up if needed.
;
; No Bluepad32 / BTstack / BLE HID libraries in this milestone.

[platformio]
default_envs = skeleton
description = BlueShift milestone 1 — repository foundation (T-Lion UNVERIFIED)

[env]
platform = espressif32 @ 6.9.0
framework = arduino
monitor_speed = 115200
; Future modules live under components/ (e.g. i18n). Linked when included.
lib_extra_dirs = components
build_flags =
    -Iinclude
    -Icomponents/i18n
    -Wall
    -Wextra
    -Wno-unused-parameter
check_tool = cppcheck
check_flags = --enable=warning
check_src_filters =
    +<src/>
    +<include/>
    +<components/>
    -<components/**/.*>

[env:skeleton]
; PROVISIONAL — compile / toolchain smoke only. Not a T-Lion board definition.
board = esp32dev
build_type = debug
build_flags =
    ${env.build_flags}
    -DBLUESHIFT_BUILD_TYPE_DEBUG=1

[env:debug]
; PLANNED environment shape for future T-Lion bring-up (same provisional board today).
extends = env:skeleton
build_type = debug
build_flags =
    ${env.build_flags}
    -DBLUESHIFT_BUILD_TYPE_DEBUG=1

[env:release]
; PLANNED release profile — reduced diagnostics once firmware exists.
extends = env:skeleton
build_type = release
build_flags =
    ${env.build_flags}
    -DBLUESHIFT_BUILD_TYPE_DEBUG=0
    -DNDEBUG
